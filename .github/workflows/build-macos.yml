name: Build StageSync Application

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build-stable:
        strategy:
            matrix:
                os: [ windows-latest, macos-latest, ubuntu-latest ]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Bun Packages
              run: bun install

            # - name: Compile TailwindCSS
            #   run: bun run build:css

            - name: Build Stable
              run: bun run build:stable

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build-${{ matrix.os }}
                path: artifacts/*
                if-no-files-found: error

            # - name: Create Stable Release
            #   uses: softprops/action-gh-release@v3
            #   with:
            #     draft: true
            #     files: |
            #       artifacts/*
    
    release:
        needs: build-stable
        runs-on: ubuntu-latest
        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                path: artifacts
                pattern: build-*
                merge-multiple: true
            
            - name: Create Stable Release
              uses: softprops/action-gh-release@v2
              with:
                files: artifacts/*

                # Mark this release as a draft for v*.*.*-draft tags
                draft: ${{ contains(github.ref_name, '-draft') }}
            
            - name: POST Webhook
              run: |
                curl \
                  --header "Content-Type: application/json" \
                  --request POST \
                  --data '{ "content": "Release Tag: `${{ github.ref_name }}` | Build Complete! <@777043422031773698>"  }' \
                  "${{ secrets.DISCORD_WEBHOOK_URL }}"